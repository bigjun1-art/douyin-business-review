name: Test background review
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/review_pipeline.py check --config examples/config.json --data examples/evidence.json
      - run: python scripts/review_pipeline.py analyze --config examples/config.json --data examples/evidence.json --out /tmp/review-analysis.json
